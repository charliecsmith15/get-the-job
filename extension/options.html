<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Get the Job — Extension Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f0e6;
      color: #24342a;
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 24px 48px;
    }
    h1 { font-size: 18px; margin-bottom: 4px; }
    p.hint { color: #6b6257; font-size: 13px; margin-top: 0; margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; }
    input[type="text"], input[type="url"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #d8cdb8;
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
    }
    .field-hint { color: #6b6257; font-size: 12px; margin-top: 4px; }
    button {
      margin-top: 24px;
      background: #b7844d;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #8d6036; }
    #status { margin-top: 14px; font-size: 13px; }
    #status.ok { color: #2d6a4f; }
    #status.err { color: #b3261e; }
  </style>
</head>
<body>
  <h1>Get the Job — Extension Settings</h1>
  <p class="hint">These settings connect the extension to the same SQL backend your web app uses.</p>

  <label for="backendUrl">Backend API base URL</label>
  <input type="url" id="backendUrl" placeholder="https://your-backend.run.app/api" />
  <p class="field-hint">Same value as "REST API Base URL" under Developer API in the web app.</p>

  <label for="allowedEmails">Allowed Google accounts (comma-separated)</label>
  <input type="text" id="allowedEmails" placeholder="you@example.com, teammate@example.com" />
  <p class="field-hint">Matches the web app's ALLOWED_EMAILS list. Only these signed-in Chrome profiles can save jobs.</p>

  <button id="save">Save settings</button>
  <div id="status"></div>

  <script type="module" src="options.js"></script>
</body>
</html>
