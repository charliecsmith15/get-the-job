steps:
  # Fetch PROXY_HEADER from Secret Manager and write it into frontend/.env.local for Vite
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        echo "PROXY_HEADER=$(gcloud secrets versions access latest --secret=proxy-header --project=job-search-app-508319)" \
          > frontend/.env.local

  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/jobsearch/careernexus', 'frontend/']

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/jobsearch/careernexus']

  # Deploy to Google Cloud Run (bash wrapper avoids gcloud dict-arg comma parsing issues)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        gcloud run deploy careernexus \
          --image "us-central1-docker.pkg.dev/$PROJECT_ID/jobsearch/careernexus" \
          --region us-central1 \
          --platform managed \
          --allow-unauthenticated \
          --port 8080 \
          --set-env-vars "^;^GOOGLE_CLOUD_PROJECT=$PROJECT_ID;GOOGLE_CLOUD_LOCATION=${_GOOGLE_CLOUD_LOCATION};GOOGLE_CLIENT_ID=111263041275-uohfrin306iaqnbetpl9ckk3k42sthed.apps.googleusercontent.com;GOOGLE_API_KEY=${_GOOGLE_API_KEY};BACKEND_URL=${_BACKEND_URL};ALLOWED_EMAILS=${_ALLOWED_EMAILS}" \
          --set-secrets "PROXY_HEADER=proxy-header:latest"

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/jobsearch/careernexus'

substitutions:
  _GOOGLE_CLOUD_LOCATION: us-central1
  _GOOGLE_API_KEY: ''
  _BACKEND_URL: 'https://jobsearch-backend-6gcehd2gma-uc.a.run.app'
  # Must match backend/cloudbuild.yaml's _ALLOWED_EMAILS exactly — this only
  # gates the sign-in screen client-side; the backend enforces the same list
  # server-side on every request. Add your demo account's email here once
  # you've created it.
  _ALLOWED_EMAILS: 'charlie@workbench-data.com,rankin@workbench-data.com,charlie@charliecsmith.com,ccsmith1534@gmail.com'

options:
  logging: CLOUD_LOGGING_ONLY
