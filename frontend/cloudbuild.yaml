steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/careernexus', 'frontend/']
  
  # Push the image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/careernexus']
  
  # Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'careernexus'
      - '--image'
      - 'gcr.io/$PROJECT_ID/careernexus'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      # Pass the Gemini API Key from Cloud Build triggers to Cloud Run
      - '--set-env-vars'
      - 'API_KEY=${_API_KEY}'

images:
  - 'gcr.io/$PROJECT_ID/careernexus'

options:
  logging: CLOUD_LOGGING_ONLY
