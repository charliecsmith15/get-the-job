steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/jobsearch/careernexus', 'frontend/']

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/jobsearch/careernexus']

  # Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'careernexus'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/jobsearch/careernexus'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      # Pass the Gemini API Key from Cloud Build triggers to Cloud Run
      - '--set-env-vars'
      - 'API_KEY=${_API_KEY}'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/jobsearch/careernexus'

options:
  logging: CLOUD_LOGGING_ONLY
